<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" role="img" aria-label="Moving through the folder"><rect width="760" height="414" rx="10" fill="#14181f"/><text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6e9ef">Moving through the folder</text><text x="24" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9ef" text-anchor="start" font-weight="600">Arrow to the next photo. It was already decoded.</text><line x1="670.0" y1="74" x2="670.0" y2="194" stroke="#4c9aff" stroke-dasharray="4 4"/><text x="670.0" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4c9aff" text-anchor="middle" font-weight="400">one refresh</text><text x="218" y="87" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">canon_eosr6.cr3</text><rect x="230" y="74" width="27.3" height="16" rx="3" fill="#3ddc97"/><text x="263.2706545869083" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">1.0 ms</text><text x="218" y="119" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">nikon_d7500.nef</text><rect x="230" y="106" width="11.0" height="16" rx="3" fill="#3ddc97"/><text x="246.9557808843823" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.4 ms</text><text x="218" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">pentax_k50.dng</text><rect x="230" y="138" width="6.0" height="16" rx="3" fill="#3ddc97"/><text x="242.04547909041818" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="218" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">sony_ilce7rm3.arw</text><rect x="230" y="170" width="11.6" height="16" rx="3" fill="#3ddc97"/><text x="247.64216715665685" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.4 ms</text><text x="24" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9ef" text-anchor="start" font-weight="600">Jump from the first photo, past the two decoded neighbours.</text><text x="218" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">pentax_k50.dng</text><rect x="230" y="236" width="352.0" height="16" rx="3" fill="#4c9aff"/><text x="588.0" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">64 ms</text><text x="218" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">sony_ilce7rm3.arw</text><rect x="230" y="268" width="291.9" height="16" rx="3" fill="#4c9aff"/><text x="527.9466468143185" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">53 ms</text><text x="24" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b94a5" text-anchor="start" font-weight="400">Each arrow waits 3 s on the current photo first, so the next one can be decoded ahead.</text><text x="24" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b94a5" text-anchor="start" font-weight="400">Time until the frame is handed to the display. A cached photo is on screen at the next refresh.</text></svg>