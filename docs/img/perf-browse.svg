<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" role="img" aria-label="Moving through the folder"><rect width="760" height="414" rx="10" fill="#14181f"/><text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6e9ef">Moving through the folder</text><text x="24" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9ef" text-anchor="start" font-weight="600">Arrow to the next photo. It was already decoded.</text><line x1="670.0" y1="74" x2="670.0" y2="194" stroke="#4c9aff" stroke-dasharray="4 4"/><text x="670.0" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4c9aff" text-anchor="middle" font-weight="400">one refresh</text><text x="218" y="87" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">canon_eosr6.cr3</text><rect x="230" y="74" width="19.0" height="16" rx="3" fill="#3ddc97"/><text x="254.9664268585132" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.7 ms</text><text x="218" y="119" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">nikon_d7500.nef</text><rect x="230" y="106" width="4.7" height="16" rx="3" fill="#3ddc97"/><text x="240.69544364508394" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="218" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">pentax_k50.dng</text><rect x="230" y="138" width="8.9" height="16" rx="3" fill="#3ddc97"/><text x="244.91606714628298" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.3 ms</text><text x="218" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">sony_ilce7rm3.arw</text><rect x="230" y="170" width="5.5" height="16" rx="3" fill="#3ddc97"/><text x="241.46043165467626" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="24" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9ef" text-anchor="start" font-weight="600">Jump from the first photo, past the two decoded neighbours.</text><text x="218" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">pentax_k50.dng</text><rect x="230" y="236" width="352.0" height="16" rx="3" fill="#4c9aff"/><text x="588.0" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">83 ms</text><text x="218" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">sony_ilce7rm3.arw</text><rect x="230" y="268" width="218.3" height="16" rx="3" fill="#4c9aff"/><text x="454.2801614735672" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">51 ms</text><text x="24" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b94a5" text-anchor="start" font-weight="400">Each arrow waits 3 s on the current photo first, so the next one can be decoded ahead.</text><text x="24" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b94a5" text-anchor="start" font-weight="400">Time until the frame is handed to the display. A cached photo is on screen at the next refresh.</text></svg>