<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" role="img" aria-label="Moving through the folder"><rect width="760" height="478" rx="10" fill="#14181f"/><text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6e9ef">Moving through the folder</text><text x="24" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9ef" text-anchor="start" font-weight="600">Arrow to the next photo. It was already decoded.</text><line x1="670.0" y1="74" x2="670.0" y2="226" stroke="#4c9aff" stroke-dasharray="4 4"/><text x="670.0" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4c9aff" text-anchor="middle" font-weight="400">one refresh</text><text x="218" y="87" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">canon_eosr6.cr3</text><rect x="230" y="74" width="5.4" height="16" rx="3" fill="#3ddc97"/><text x="241.38129496402877" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="218" y="119" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">libheif-example.heic</text><rect x="230" y="106" width="4.5" height="16" rx="3" fill="#3ddc97"/><text x="240.45803357314148" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="218" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">nikon_d7500.nef</text><rect x="230" y="138" width="4.7" height="16" rx="3" fill="#3ddc97"/><text x="240.74820143884892" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="218" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">pentax_k50.dng</text><rect x="230" y="170" width="4.9" height="16" rx="3" fill="#3ddc97"/><text x="240.9064748201439" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="218" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">sony_ilce7rm3.arw</text><rect x="230" y="202" width="6.0" height="16" rx="3" fill="#3ddc97"/><text x="241.98800959232614" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">0.2 ms</text><text x="24" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9ef" text-anchor="start" font-weight="600">Jump from the first photo, past the two decoded neighbours.</text><text x="218" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">nikon_d7500.nef</text><rect x="230" y="268" width="352.0" height="16" rx="3" fill="#4c9aff"/><text x="588.0" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">100 ms</text><text x="218" y="313" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">pentax_k50.dng</text><rect x="230" y="300" width="237.4" height="16" rx="3" fill="#4c9aff"/><text x="473.3946928185761" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">67 ms</text><text x="218" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e9ef" text-anchor="end" font-weight="400">sony_ilce7rm3.arw</text><rect x="230" y="332" width="179.7" height="16" rx="3" fill="#4c9aff"/><text x="415.6583289090126" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e9ef" text-anchor="start" font-weight="400">51 ms</text><text x="24" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b94a5" text-anchor="start" font-weight="400">Each arrow waits 3 s on the current photo first, so the next one can be decoded ahead.</text><text x="24" y="466" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b94a5" text-anchor="start" font-weight="400">Time until the frame is handed to the display. A cached photo is on screen at the next refresh.</text></svg>