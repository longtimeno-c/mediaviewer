# Pin vcpkg to vcpkg.json's builtin-baseline and restore the one installed tree
# shared by every Windows job. Callers that miss the cache must install and
# save it themselves; this action never writes the cache, so a failing test
# cannot throw a 45-minute install away and parallel jobs cannot race to
# reserve the same key.

name: Windows vcpkg
description: Check out the pinned vcpkg, bootstrap it, and restore the shared installed-tree cache.

outputs:
  cache-hit:
    description: 'true when build/vcpkg_installed was restored'
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-primary-key:
    description: Cache key to pass to actions/cache/save after a miss
    value: ${{ steps.cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Check out vcpkg at the manifest baseline
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.VCPKG_COMMIT }}
        path: vcpkg
        # Full history, not shallow. Manifest mode resolves the baseline
        # through git, and vcpkg has been known to refuse a shallow clone.
        fetch-depth: 0

    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
        "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV
        # vcpkg folds its host tools (CMake, PowerShell) into every package
        # ABI. windows-latest mixes image versions whose tools differ, so a
        # job on the other image rebuilt every port inside Configure and hit
        # the job limit. vcpkg's own pinned tools are the same on every image.
        "VCPKG_FORCE_DOWNLOADED_BINARIES=1" >> $env:GITHUB_ENV

    # One key for every Windows toolchain. The manifest builds the x64-windows
    # triplet with the image's MSVC; clang-cl and ASan compile our code, not
    # these ports. The key covers the overlay ports and triplets as well as the
    # manifest. The overlay triplet disables compiler tracking and the pinned
    # host tools above do the rest, so a runner on a different image version
    # reuses the tree instead of rebuilding it. -pinned-tools: trees from
    # before the pin have different ABIs and must not be restored. The macOS
    # overlay triplets are excluded: they cannot change a Windows package.
    - name: Restore installed packages
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: build/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg/**', '!tools/vcpkg/triplets/*-osx.cmake') }}-msvc-pinned-tools
