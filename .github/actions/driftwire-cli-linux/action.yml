# The driftwire command line's Linux packages (docs/design/28 "From a
# terminal", cmake/driftwire-cli), built the same way for CI and for a
# release: the pinned vcpkg with tools/portable/vcpkg.json (static libsodium,
# BLAKE3, FTXUI, Catch2), GCC 12 on Ubuntu 22.04 (glibc 2.35 is the floor),
# the "[cli]" suites, the NEEDED gate (part of the build: only libc, libm and
# the loader), the .deb, .rpm and tarball in dist/, and the .deb installed
# and run. The caller checks out the repository, runs on the architecture's
# runner, sets CC / CXX to gcc-12 / g++-12, and uploads dist/.

name: driftwire Linux packages
description: Build, test and package the driftwire command line for Linux, and install the .deb.

inputs:
  arch:
    description: 'x64 or arm64 (the runner''s)'
    required: true
  version:
    description: 'The version the packages must carry (empty: the root CMakeLists.txt''s)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check out vcpkg at the manifest baseline
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.VCPKG_COMMIT }}
        path: vcpkg
        fetch-depth: 0

    # libsodium's vcpkg port builds with autotools; rpm is rpmbuild for
    # CPack. vcpkg downloads x64 tools only, so on arm64 it uses the system's
    # (VCPKG_FORCE_SYSTEM_BINARIES). The project needs CMake 3.28: the images
    # carry a newer one; if one does not, pip's wheel stands in.
    - name: Build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends g++-12 autoconf autoconf-archive automake libtool \
          pkg-config ninja-build rpm curl zip unzip tar
        if ! cmake --version 2>/dev/null | awk 'NR == 1 { split($3, v, "."); exit !(v[1] > 3 || (v[1] == 3 && v[2] >= 28)) }'; then
          python3 -m pip install --user 'cmake>=3.28,<4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        if [ "${{ inputs.arch }}" = arm64 ]; then
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"
        fi

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

    # The architecture and the compiler are in the key: a tree from another
    # one has other package ABIs.
    - name: Restore vcpkg packages
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: build-cli/vcpkg_installed
        key: vcpkg-driftwire-cli-${{ runner.os }}-${{ runner.arch }}-gcc12-${{ env.VCPKG_COMMIT }}-${{ hashFiles('tools/portable/vcpkg.json') }}

    - name: Configure
      shell: bash
      run: |
        cmake --version
        "${CXX:-c++}" --version | head -n 1
        cmake -S cmake/driftwire-cli -B build-cli -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/tools/portable" \
          -DMV_DRIFTWIRE_CLI_TESTS=ON

    # Saved before the build can fail, so a failing build does not throw the
    # installed tree away.
    - name: Save vcpkg packages
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: build-cli/vcpkg_installed
        key: ${{ steps.cache.outputs.cache-primary-key }}

    # Includes driftwire_needed, which fails the build if the program needs
    # anything but libc, libm and the loader.
    - name: Build
      shell: bash
      run: |
        cmake --build build-cli
        readelf -d build-cli/bin/driftwire | grep NEEDED

    # The "[cli]" suites: the terminal layer and the look, the session over
    # two engines on loopback, and two programs in ptys end to end (about a
    # minute on a 4-vCPU container). ctest's bound is 15 minutes.
    - name: Tests
      shell: bash
      run: ctest --test-dir build-cli --output-on-failure

    - name: Packages
      shell: bash
      run: |
        (cd build-cli && cpack -G "DEB;RPM;TGZ" -B "$GITHUB_WORKSPACE/dist")
        cd dist
        ls -l ./*.deb ./*.rpm ./*.tar.gz
        dpkg-deb --info ./*.deb
        dpkg-deb --contents ./*.deb
        rpm -qpi ./*.rpm
        rpm -qpR ./*.rpm
        rpm -qp --recommends ./*.rpm
        rpm -qpl ./*.rpm
        tar -tzf ./*.tar.gz

    # The .deb installed as a person would, and run: its version is the
    # release's, --help needs no terminal, and the session refuses to start
    # without one (exit 2: it asks before anything is sent or saved).
    - name: Install and run the .deb
      shell: bash
      env:
        WANT_VERSION: ${{ inputs.version }}
      run: |
        version="$WANT_VERSION"
        if [ -z "$version" ]; then
          version=$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
        fi
        sudo apt-get install -y ./dist/driftwire_"$version"_*.deb
        test "$(driftwire --version)" = "driftwire $version"
        driftwire --help > /dev/null
        rc=0
        driftwire < /dev/null > /dev/null 2>&1 || rc=$?
        test "$rc" -eq 2
        sudo apt-get remove -y driftwire
        test ! -e /usr/bin/driftwire
