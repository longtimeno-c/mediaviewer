# Deliberate releases only. CI validates pushes/PRs; this builds both installers,
# and the driftwire command line for all three systems (docs/design/28 "Installing").
# See RELEASING.md for the three modes and credentials.
name: Release
run-name: Release ${{ inputs.mode }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'artifacts: unsigned test packaging; preview: signed prerelease for the Preview update channel; stable: signed Latest release'
        type: choice
        options: [artifacts, preview, stable]
        default: artifacts
      min_version:
        description: 'Windows minimum supported version (normally leave at 0.0.0)'
        type: string
        default: '0.0.0'
      blocklist:
        description: 'Windows versions to withdraw, comma separated (normally empty)'
        type: string
        default: ''

permissions:
  contents: read
  actions: write

# Serialise publication across refs, so an older run cannot overtake a newer one.
concurrency:
  group: mediaviewer-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  VCPKG_COMMIT: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
  MV_SPARKLE_PUBLIC_ED_KEY: WlC8RKaTk3OI92qe+0nQOCQwGDuVrJA9IuZZYkRyGCM=
  MV_MAC_SIGN_IDENTITY: 'Developer ID Application: Oakforge Studios LTD (23FQ4A4Q35)'

jobs:
  prepare:
    name: Check version and release credentials
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight (before either expensive build)
        id: prepare
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          MIN_VERSION: ${{ inputs.min_version }}
          BLOCKLIST: ${{ inputs.blocklist }}
          MV_MANIFEST_SIGNING_KEY: ${{ secrets.MV_MANIFEST_SIGNING_KEY }}
          MV_MAC_CERT_P12_BASE64: ${{ secrets.MV_MAC_CERT_P12_BASE64 }}
          MV_MAC_CERT_PASSWORD: ${{ secrets.MV_MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MV_SPARKLE_PRIVATE_KEY: ${{ secrets.MV_SPARKLE_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          MV_DRIFTWIRE_REPO: ${{ vars.MV_DRIFTWIRE_REPO }}
          # Whether the driftwire repository's signing key and the Homebrew tap's
          # token are set, never what they hold: only driftwire-repo's signing step
          # is given the key, and only driftwire-homebrew the token.
          DRIFTWIRE_REPO_KEY_SET: ${{ secrets.DRIFTWIRE_REPO_GPG_KEY != '' && '1' || '' }}
          HOMEBREW_TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && '1' || '' }}
        run: python3 tools/package/github-release.py prepare

  windows:
    name: Windows x64 installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Same installed tree as CI. A release that starts after CI has saved it
      # configures in about a minute. A miss still installs, then saves, so the
      # next CI run does not rebuild FFmpeg.
      - name: vcpkg
        id: vcpkg
        uses: ./.github/actions/windows-vcpkg

      - name: Configure
        run: |
          # NVIDIA acceleration (ai-cuda) is packed on stable runs only, like the other add-ons.
          $cuda = if ($env:MODE -eq 'stable') { 'ON' } else { 'OFF' }
          cmake -S . -B build -A x64 "-DMV_IMPORT_VERSION=$env:VERSION" "-DMV_AI_VERSION=$env:VERSION" "-DMV_AI_CUDA_PIECE=$cuda"

      - name: Save dependencies before packaging can fail
        if: steps.vcpkg.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg_installed
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}

      - name: Build (Release)
        run: cmake --build build --config Release

      # The framework-dependent dev build the tests load needs this; the shipped
      # payload carries its own runtimes and does not.
      - name: Install Windows App SDK runtime (tests only)
        run: ./tools/install-windows-app-runtime.ps1

      - name: Unit tests
        timeout-minutes: 20
        # The corpus-gated cases are CI's Build job (tests/corpus.h); a release
        # does not regenerate 1.5 GB of clips. Saying '0' out loud is what
        # test_corpus.cpp's CI guard accepts as a decision rather than an oversight.
        env:
          MV_REQUIRE_CORPUS: '0'
          # Scratch on the runner's local disk, as CI's Unit tests (ci.yml).
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Licence policy (manifest + vcpkg tree)
        run: ./tools/licence-check.ps1 -VcpkgInstalledRoot build/vcpkg_installed

      - name: Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Ensure Inno Setup 6 is available
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --version=6.5.4 --yes --no-progress
            if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          }

      - name: Signing material
        id: sign
        if: inputs.mode != 'artifacts'
        env:
          MV_MANIFEST_SIGNING_KEY: ${{ secrets.MV_MANIFEST_SIGNING_KEY }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'release.key'
          Set-Content -LiteralPath $key -Value $env:MV_MANIFEST_SIGNING_KEY -Encoding ascii -NoNewline
          if (-not (Test-Path -LiteralPath $key -PathType Leaf)) { throw 'Manifest key file was not created' }
          "key=$key" >> $env:GITHUB_OUTPUT
          if ($env:TRUSTED_SIGNING_ENDPOINT) {
            $meta = Join-Path $env:RUNNER_TEMP 'trusted-signing.json'
            @{
              Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
              CertificateProfileName = $env:TRUSTED_SIGNING_PROFILE
            } | ConvertTo-Json | Set-Content -LiteralPath $meta -Encoding utf8
            "meta=$meta" >> $env:GITHUB_OUTPUT
          }

      - name: Package (payload, Velopack set, manifest, wizard)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_METADATA: ${{ steps.sign.outputs.meta }}
          MANIFEST_KEY: ${{ steps.sign.outputs.key }}
          MIN_VERSION: ${{ inputs.min_version }}
          BLOCKLIST: ${{ inputs.blocklist }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $a = @{ BuildDir = 'build'; Version = $env:VERSION; MinVersion = $env:MIN_VERSION; Blocklist = $env:BLOCKLIST }
          if ($env:SIGNING_METADATA) { $a.SigningMetadata = $env:SIGNING_METADATA }
          if ($env:MANIFEST_KEY) { $a.ManifestKey = $env:MANIFEST_KEY }
          ./tools/package/build-release.ps1 @a

      # Velopack signs the payload and its setup bundle; ISCC's outer wizard
      # needs its own signature after packaging.
      - name: Sign installer wizard
        if: steps.sign.outputs.meta != ''
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed update feed
        if: inputs.mode != 'artifacts'
        run: dotnet run --project src.managed/MediaViewer.Updater.Tests -c Release -- verify-release dist/releases

      # The Import add-on (docs/design/18): built beside the app, never in it, and
      # published as its own signed download on the same release. The apps
      # fetch it from releases/latest, so every stable release carries it.
      - name: Find the Import add-on build
        id: addon
        if: inputs.mode == 'stable'
        run: |
          $dll = Get-ChildItem build/addons/import -Recurse -Filter mv_import.dll | Select-Object -First 1
          if (-not $dll) { throw 'mv_import.dll was not built' }
          "dir=$($dll.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Sign the Import add-on's binaries
        if: inputs.mode == 'stable' && steps.sign.outputs.meta != ''
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ steps.addon.outputs.dir }}
          files-folder-filter: dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack the Import add-on
        if: inputs.mode == 'stable'
        env:
          MANIFEST_KEY: ${{ steps.sign.outputs.key }}
          ADDON_DIR: ${{ steps.addon.outputs.dir }}
        run: |
          python -m pip install --disable-pip-version-check -r tools/package/requirements.txt
          if ($LASTEXITCODE) { throw 'pip install failed' }
          python tools/package/addon-pack.py pack --platform win-x64 --src $env:ADDON_DIR `
            --version $env:VERSION --key $env:MANIFEST_KEY --out dist/addon --require-pinned-key
          if ($LASTEXITCODE) { throw 'add-on packing failed' }

      # Places (docs/design/27): preferred, not required. The DLL is signed like
      # Import's; the place database is built by tools/geo/build_places.py from
      # its pinned downloads into the add-on's data/ folder, then packed.
      # --accept-upstream: GeoNames republishes its dump daily under the same
      # URL, so the pins go stale (owner call open in docs/design/27: mirror
      # the snapshot); the blob's META records every input's hash either way.
      # A miss here does not fail the release: publish carries Places when the
      # pack is complete and publishes without it when the pack is absent.
      - name: Find the Places add-on build
        id: places
        if: inputs.mode == 'stable'
        run: |
          $dll = Get-ChildItem build/addons/places -Recurse -Filter mv_places.dll | Select-Object -First 1
          if (-not $dll) {
            Write-Warning 'mv_places.dll was not built; this release will not carry Places.'
            "dir=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "dir=$($dll.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Sign the Places add-on's binary
        if: inputs.mode == 'stable' && steps.sign.outputs.meta != '' && steps.places.outputs.dir != ''
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ steps.places.outputs.dir }}
          files-folder-filter: dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Stage the place database and pack the Places add-on
        if: inputs.mode == 'stable'
        env:
          MANIFEST_KEY: ${{ steps.sign.outputs.key }}
          PLACES_DIR: ${{ steps.places.outputs.dir }}
        run: |
          if (-not $env:PLACES_DIR) { exit 0 }
          $packed = @(
            'dist/addon/mediaviewer-addon-places-win-x64.zip',
            'dist/addon/mediaviewer-addon-places-win-x64.json',
            'dist/addon/mediaviewer-addon-places-win-x64.json.sig'
          )
          try {
            python tools/package/addon-pack.py stage-places --src $env:PLACES_DIR `
              --downloads (Join-Path $env:RUNNER_TEMP 'geo-downloads') --accept-upstream
            if ($LASTEXITCODE) { throw 'staging the place database failed' }
            python tools/package/addon-pack.py pack --addon places --platform win-x64 --src $env:PLACES_DIR `
              --version $env:VERSION --key $env:MANIFEST_KEY --out dist/addon --require-pinned-key
            if ($LASTEXITCODE) { throw 'packing places failed' }
          } catch {
            Write-Warning "Places was not packed ($_). This release will not carry it."
            Remove-Item -LiteralPath $packed -Force -ErrorAction SilentlyContinue
            exit 0
          }

      # Driftwire (docs/design/28): code only; signed like Import's DLL.
      - name: Find the Driftwire add-on build
        id: driftwire
        if: inputs.mode == 'stable'
        run: |
          $dll = Get-ChildItem build/addons/driftwire -Recurse -Filter mv_driftwire.dll | Select-Object -First 1
          if (-not $dll) { throw 'mv_driftwire.dll was not built' }
          "dir=$($dll.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Sign the Driftwire add-on's binary
        if: inputs.mode == 'stable' && steps.sign.outputs.meta != ''
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ steps.driftwire.outputs.dir }}
          files-folder-filter: dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack the Driftwire add-on
        if: inputs.mode == 'stable'
        env:
          MANIFEST_KEY: ${{ steps.sign.outputs.key }}
          DRIFTWIRE_DIR: ${{ steps.driftwire.outputs.dir }}
        run: |
          python tools/package/addon-pack.py pack --addon driftwire --platform win-x64 --src $env:DRIFTWIRE_DIR `
            --version $env:VERSION --key $env:MANIFEST_KEY --out dist/addon --require-pinned-key
          if ($LASTEXITCODE) { throw 'packing driftwire failed' }

      # Local search (docs/design/17): the Core pack and its Sound and People pieces,
      # each its own signed download on the same release, like Import. Our own
      # two DLLs and PDFium (#354; unsigned as bblanchon/pdfium-binaries ships it,
      # as the Mac pack signs its dylib) are signed; ONNX Runtime's carry
      # Microsoft's signature.
      - name: Collect the Local search binaries to sign
        id: aisign
        if: inputs.mode == 'stable'
        run: |
          foreach ($f in 'mv_ai.dll', 'MediaViewer.Ai.Chrome.dll', 'pdfium.dll') {
            if (-not (Test-Path "build/addons/ai/$f")) { throw "$f was not built" }
          }
          $dir = Join-Path $env:RUNNER_TEMP 'ai-sign'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/addons/ai/mv_ai.dll, build/addons/ai/MediaViewer.Ai.Chrome.dll, build/addons/ai/pdfium.dll $dir
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Sign the Local search binaries
        if: inputs.mode == 'stable' && steps.sign.outputs.meta != ''
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ steps.aisign.outputs.dir }}
          files-folder-filter: dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack the Local search pack and pieces
        if: inputs.mode == 'stable'
        timeout-minutes: 45
        env:
          MANIFEST_KEY: ${{ steps.sign.outputs.key }}
          SIGNED: ${{ steps.aisign.outputs.dir }}
        run: |
          Copy-Item "$env:SIGNED/*.dll" build/addons/ai -Force
          $notices = Get-ChildItem build/_ort -Recurse -Filter ThirdPartyNotices.txt | Select-Object -First 1
          if (-not $notices) { throw 'ONNX Runtime ThirdPartyNotices.txt not found' }
          Copy-Item $notices.FullName build/addons/ai
          # Staging re-exports our own models (face-export.py, clip-export.py: torch).
          python -m pip install --disable-pip-version-check -r tools/package/requirements-export.txt
          if ($LASTEXITCODE) { throw 'pip install (model export) failed' }
          # Pinned revisions, SHA-256 and licence checked (docs/design/17 licence gate).
          # --upstream remote (#482): upstream models are listed in the signed
          # manifest and fetched from Hugging Face on install, never zipped here.
          foreach ($piece in 'ai', 'ai-audio', 'ai-docs', 'ai-faces', 'ai-large') {
            python tools/package/ai-models.py stage --piece $piece --out "build/addons/$piece" --upstream remote
            if ($LASTEXITCODE) { throw "staging $piece models failed" }
            python tools/package/addon-pack.py pack --addon $piece --platform win-x64 --src "build/addons/$piece" `
              --version $env:VERSION --key $env:MANIFEST_KEY --out dist/addon --require-pinned-key
            if ($LASTEXITCODE) { throw "packing $piece failed" }
          }
          # NVIDIA acceleration: ORT's CUDA build only (MIT, Microsoft-signed), no models;
          # the CUDA runtime and cuDNN stay user-supplied (log 2026-10-03).
          foreach ($f in 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'onnxruntime_providers_cuda.dll') {
            if (-not (Test-Path "build/addons/ai-cuda/$f")) { throw "ai-cuda: $f was not staged" }
          }
          python tools/package/addon-pack.py pack --addon ai-cuda --platform win-x64 --src build/addons/ai-cuda `
            --version $env:VERSION --key $env:MANIFEST_KEY --out dist/addon --require-pinned-key
          if ($LASTEXITCODE) { throw 'packing ai-cuda failed' }

      # The driftwire command line (docs/design/28 "Installing"), in every mode:
      # driftwire.exe and every DLL it loads (libsodium and BLAKE3 from the
      # build, the Visual C++ runtime from Visual Studio's redistributable,
      # found from the import tables), staged by driftwire-windows.ps1; ours
      # signed like the add-ons' binaries (Microsoft's runtime keeps its own
      # signature); then zipped. A stable release carries the zip once the
      # command line is published (MV_DRIFTWIRE_REPO, publish below), and the
      # package repository's site serves it to the PowerShell one-liner. Never
      # in the app's payload (build-release.ps1).
      - name: Stage the driftwire command line
        run: ./tools/package/driftwire-windows.ps1 -Action Stage -BuildDir build -Config Release -Version $env:VERSION -OutDir dist/driftwire-cli

      - name: Sign the driftwire command line
        if: steps.sign.outputs.meta != ''
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist/driftwire-cli/sign
          files-folder-filter: exe,dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack the driftwire command line
        run: ./tools/package/driftwire-windows.ps1 -Action Pack -Version $env:VERSION -OutDir dist/driftwire-cli

      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item "dist/MediaViewer-$env:VERSION-Setup.exe" upload
          # Publish uploads it only when the command line is published.
          Copy-Item "dist/driftwire-cli/driftwire-$env:VERSION-windows-x64.zip" upload
          if ($env:MODE -ne 'artifacts') {
            Copy-Item dist/releases/*.nupkg upload
            Copy-Item dist/releases/RELEASES, dist/releases/releases.win.json, dist/releases/assets.win.json upload
            Copy-Item dist/releases/mediaviewer-manifest.json, dist/releases/mediaviewer-manifest.json.sig upload
          }
          # Add-ons stay on the stable feed (docs/design/18): previews carry none.
          if ($env:MODE -eq 'stable') {
            foreach ($addon in 'import', 'driftwire', 'ai', 'ai-audio', 'ai-docs', 'ai-faces', 'ai-large', 'ai-cuda') {
              Copy-Item "dist/addon/mediaviewer-addon-$addon-win-x64.zip", "dist/addon/mediaviewer-addon-$addon-win-x64.json", "dist/addon/mediaviewer-addon-$addon-win-x64.json.sig" upload
            }
            # Places is preferred: upload a complete pack, and publish without it
            # when packing produced nothing. A partial pack is not uploaded.
            $places = @(
              'dist/addon/mediaviewer-addon-places-win-x64.zip',
              'dist/addon/mediaviewer-addon-places-win-x64.json',
              'dist/addon/mediaviewer-addon-places-win-x64.json.sig'
            )
            $have = @($places | Where-Object { Test-Path -LiteralPath $_ })
            if ($have.Count -eq 3) {
              Copy-Item -LiteralPath $places upload
            } elseif ($have.Count -gt 0) {
              throw 'Places add-on pack is incomplete'
            } else {
              Write-Warning 'Places add-on was not packed; this release will not carry it.'
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.prepare.outputs.version }}
          path: upload/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          foreach ($name in 'release.key', 'trusted-signing.json') {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Force -ErrorAction SilentlyContinue
          }

  # One native build per architecture: each has its own vcpkg triplet and
  # dylibs, and the Intel tests run on Intel. `macos` below joins the two apps.
  # The legs run in parallel: separate runners, separate cache keys (the
  # triplet is in the key), and `macos` already waits for both.
  macos-build:
    name: macOS ${{ matrix.arch }} app
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, triplet: arm64-osx, experimental: false }
          - { arch: x64, runner: macos-15-intel, triplet: x64-osx, experimental: true }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MODE: ${{ inputs.mode }}
      TRIPLET: ${{ matrix.triplet }}
      # docs/design/23: the Final Cut Pro agent's Mach service and the extension's app
      # group are named under the team that signs the app.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/vcpkg_installed
            build/vcpkg_dynamic
            build/libomp
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'tools/mac/dependencies/vcpkg.json', 'tools/mac/dependencies/vcpkg-configuration.json', 'tools/vcpkg/ports/**', 'tools/mac/triplets/*.cmake', 'tools/vcpkg/triplets/*-osx.cmake', 'tools/mac/build_libomp.py') }}-${{ matrix.triplet }}-mixed-v2

      # LibRaw's OpenMP runtime, built for the app's 14.0. Homebrew's libomp
      # declares the runner's macOS as its minimum and ships in Frameworks
      # (issue #158). The triplet and CMake read MV_LIBOMP_ROOT.
      - name: Build libomp for the deployment target
        run: |
          arch=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          python3 tools/mac/build_libomp.py --prefix "build/libomp/$arch" --arch "$arch"
          echo "MV_LIBOMP_ROOT=$GITHUB_WORKSPACE/build/libomp/$arch" >> "$GITHUB_ENV"

      # CMake installs the static, permissive dependencies from the root
      # manifest. Keep the LGPL dylibs in a separate manifest/install tree:
      # a subsequent manifest install otherwise removes the other triplet.
      - name: Install macOS dynamic codec libraries
        run: |
          # libsodium (Import add-on) builds through autoreconf in vcpkg.
          brew install nasm ninja autoconf autoconf-archive automake libtool
          "$VCPKG_ROOT/vcpkg" install --triplet "$TRIPLET-dynamic" \
            --overlay-triplets="$GITHUB_WORKSPACE/tools/mac/triplets" \
            --x-manifest-root="$GITHUB_WORKSPACE/tools/mac/dependencies" \
            --x-install-root="$GITHUB_WORKSPACE/build/vcpkg_dynamic"

      # Intel runners keep Homebrew in /usr/local, a default compiler search
      # path. Its jpeg-turbo headers (JPEG_LIB_VERSION 80) then shadow vcpkg's
      # (62) and every libjpeg call fails "Wrong JPEG library version". Unlink
      # Homebrew's copies of the libraries vcpkg supplies; keg paths remain.
      - name: Hide Homebrew copies of vcpkg libraries
        run: |
          ls -l /usr/local/include/jpeglib.h 2>/dev/null || true
          for f in jpeg-turbo jpeg libpng webp libtiff giflib little-cms2 sqlite \
                   libheif libde265 libavif aom dav1d libraw exiv2 ffmpeg; do
            if brew list --formula "$f" >/dev/null 2>&1; then brew unlink "$f" || true; fi
          done
          if [ -e /usr/local/include/jpeglib.h ]; then
            echo "/usr/local/include/jpeglib.h still present" >&2
            ls -l /usr/local/include/jpeglib.h >&2
            exit 1
          fi

      - name: Configure
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DMV_MAC_BUILD_NUMBER="$VERSION" -DMV_IMPORT_VERSION="$VERSION"
                -DMV_AI_VERSION="$VERSION"
                -G Ninja
                -DVCPKG_TARGET_TRIPLET="$TRIPLET"
                -DMV_VCPKG_DYNAMIC_PREFIX="$GITHUB_WORKSPACE/build/vcpkg_dynamic/$TRIPLET-dynamic")
          if [ "$MODE" != "artifacts" ]; then
            args+=(-DMV_SPARKLE_PUBLIC_ED_KEY="$MV_SPARKLE_PUBLIC_ED_KEY")
          fi
          # Both legs: the app compiles the agent's name on both architectures.
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            args+=(-DMV_FCP_TEAM_ID="$APPLE_TEAM_ID")
          fi
          cmake -S . -B build "${args[@]}"

      - name: Save dependencies before packaging can fail
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/vcpkg_installed
            build/vcpkg_dynamic
            build/libomp
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # The Windows job's gate over both Mac trees: the static, permissive one
      # and the LGPL dylibs the app bundles (docs/design/11).
      - name: Licence policy (manifests + vcpkg trees)
        shell: pwsh
        run: ./tools/licence-check.ps1 -VcpkgInstalledRoot build/vcpkg_installed, build/vcpkg_dynamic

      - name: Build app and test executables
        run: |
          cmake --build build --config Release
          cmake --build build --config Release --target mediaviewer_app

      - name: Unit tests
        timeout-minutes: 20
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Bundle policy
        run: |
          python3 tools/mac/check_plists.py
          python3 tools/mac/test_macpack.py -v
          python3 tools/mac/test_check_minos.py -v
          # Nothing shipped may need a newer macOS than LSMinimumSystemVersion.
          python3 tools/mac/check_minos.py build/MediaViewer.app build/addons/import build/addons/places \
            build/addons/driftwire \
            $([[ -d build/addons/ai ]] && echo build/addons/ai)

      # upload-artifact zips drop symlinks and modes; Sparkle.framework needs both.
      - name: Archive the app
        run: |
          mkdir -p upload
          tar -C build -cf "upload/MediaViewer-${{ matrix.arch }}.tar" MediaViewer.app
          # The Import add-on, joined and signed in `macos` like the app.
          tar -C build/addons/import -cf "upload/ImportAddon-${{ matrix.arch }}.tar" libmv_import.dylib Import.bundle
          # Places: the dylib only; its place database is staged once, in `macos`.
          tar -C build/addons/places -cf "upload/PlacesAddon-${{ matrix.arch }}.tar" libmv_places.dylib
          # Driftwire (docs/design/28): the dylib, joined and signed in `macos`.
          tar -C build/addons/driftwire -cf "upload/DriftwireAddon-${{ matrix.arch }}.tar" libmv_driftwire.dylib
          # The driftwire command line (docs/design/28 "Installing"), joined, signed and packed in `macos`.
          tar -C build/bin -cf "upload/DriftwireCli-${{ matrix.arch }}.tar" driftwire
          # Local search is arm64 only (ORT ships no x86_64 macOS build).
          if [[ -d build/addons/ai ]]; then
            cp build/_ort/*/ThirdPartyNotices.txt build/addons/ai/
            tar -C build/addons/ai -cf "upload/AiAddon-${{ matrix.arch }}.tar" \
              libmv_ai.dylib libonnxruntime.dylib libpdfium.dylib AI.bundle ThirdPartyNotices.txt pdfium-licenses
          fi

      # No version suffix: publish only collects artifacts named *-<version>.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: upload/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal disk image
    needs: [prepare, macos-build]
    runs-on: macos-14
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-app-*
          path: apps
          merge-multiple: true

      - name: Signing keychain
        if: inputs.mode != 'artifacts'
        env:
          CERT_P12: ${{ secrets.MV_MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MV_MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.MV_SPARKLE_PRIVATE_KEY }}
          MANIFEST_KEY: ${{ secrets.MV_MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # The add-on manifest's Ed25519 key (the update key, docs/design/18).
          printf '%s' "$MANIFEST_KEY" > "$RUNNER_TEMP/release.key"
          kc="$RUNNER_TEMP/mv-signing.keychain-db"
          kcpw="$(openssl rand -hex 16)"
          echo "::add-mask::$kcpw"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          security default-keychain -d user -s "$kc"
          xcrun notarytool store-credentials mediaviewer-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
          # Keep a private file for generate_appcast: accessing generate_keys'
          # keychain item from another executable can prompt on a headless runner.
          keyfile="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_KEY" > "$keyfile"
          # generate_appcast/generate_keys come from the same hash-pinned Sparkle
          # archive the app builds embed (cmake/darwin-app.cmake).
          curl -sfL -o "$RUNNER_TEMP/Sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          echo "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          "$RUNNER_TEMP/sparkle/bin/generate_keys" -f "$keyfile"
          actual_key="$("$RUNNER_TEMP/sparkle/bin/generate_keys" -p)"
          if [ "$actual_key" != "$MV_SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "Sparkle private key does not match the pinned public key." >&2
            exit 1
          fi

      - name: Join the ARM and Intel apps when both are available
        run: |
          set -euo pipefail
          mkdir -p arm64 build/universal
          tar -xf apps/MediaViewer-arm64.tar -C arm64
          if [[ -f apps/MediaViewer-x64.tar ]]; then
            mkdir -p x86_64
            tar -xf apps/MediaViewer-x64.tar -C x86_64
            python3 tools/mac/lipo_merge.py --arm64 arm64/MediaViewer.app \
              --x86_64 x86_64/MediaViewer.app --out build/universal/MediaViewer.app
          else
            cp -R arm64/MediaViewer.app build/universal/MediaViewer.app
          fi
          app=build/universal/MediaViewer.app
          if [[ -f apps/MediaViewer-x64.tar ]]; then
            for f in "$app/Contents/MacOS/MediaViewer" "$app"/Contents/Frameworks/*.dylib; do
              archs="$(lipo -archs "$f")"
              case "$archs" in
                *arm64*x86_64*|*x86_64*arm64*) ;;
                *) echo "$f is $archs, not universal" >&2; exit 1 ;;
              esac
            done
          fi

      # A job-local venv: the runner's Homebrew Python owns packages such as
      # cryptography that pip cannot uninstall, so pinned versions go here.
      # requirements-export.txt: staging re-exports our own models (People embedder, #482 towers)
      # (face-export.py, torch); the stable add-on step needs it.
      - name: Python tools (dmgbuild, add-on packer)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pyenv"
          reqs=(-r tools/mac/requirements.txt -r tools/package/requirements.txt)
          if [ "$MODE" = "stable" ]; then reqs+=(-r tools/package/requirements-export.txt); fi
          "$RUNNER_TEMP/pyenv/bin/python" -m pip install --disable-pip-version-check "${reqs[@]}"
          echo "$RUNNER_TEMP/pyenv/bin" >> "$GITHUB_PATH"

      - name: Disk image
        timeout-minutes: 30
        env:
          # #501: Driftwire's keychain app group is "<team>.<bundle id>.driftwire".
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--app build/universal/MediaViewer.app --out-dir build/release)
          if [ "$MODE" != "artifacts" ]; then
            args+=(--identity "$MV_MAC_SIGN_IDENTITY" --notary-profile mediaviewer-notary
                   --team-id "$APPLE_TEAM_ID"
                   --sparkle-bin "$RUNNER_TEMP/sparkle/bin"
                   --sparkle-key-file "$RUNNER_TEMP/sparkle.key"
                   --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/")
          else
            args+=(--identity - --skip-notarize --allow-no-updater)
          fi
          python3 tools/mac/macpack.py release "${args[@]}"
          mkdir -p upload
          cp "build/release/MediaViewer-$VERSION.dmg" upload/
          if [ "$MODE" != "artifacts" ]; then
            cp "build/release/updates/MediaViewer-$VERSION.zip" build/release/updates/appcast.xml upload/
          fi

      # The driftwire command line (docs/design/28 "Installing"), in every mode:
      # the two programs joined, signed by macpack.py cli (Developer ID, the
      # hardened runtime, a stable identifier, no entitlements: it keeps nothing
      # in the keychain, #501; ad hoc in artifacts mode), notarized on a stable
      # release, and packed as driftwire-<version>-macos-universal.tar.gz, or
      # -arm64 when the Intel leg did not build. A stable release carries it
      # once the command line is published (MV_DRIFTWIRE_REPO), and the Homebrew
      # tap's formula installs it from there (driftwire-homebrew below).
      - name: driftwire command line (join, sign, notarize, pack)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p cli/arm64
          tar -xf apps/DriftwireCli-arm64.tar -C cli/arm64
          if [[ -f apps/DriftwireCli-x64.tar ]]; then
            mkdir -p cli/x86_64
            tar -xf apps/DriftwireCli-x64.tar -C cli/x86_64
            python3 tools/mac/lipo_merge.py --arm64 cli/arm64 --x86_64 cli/x86_64 --out build/cli
          else
            echo "::warning::No Intel build: the command line's macOS archive is arm64 only."
            cp -R cli/arm64 build/cli
          fi
          args=(--binary build/cli/driftwire --version "$VERSION" --out-dir build/release/cli)
          case "$MODE" in
            artifacts) args+=(--identity - --skip-notarize) ;;
            stable) args+=(--identity "$MV_MAC_SIGN_IDENTITY" --notary-profile mediaviewer-notary) ;;
            *) args+=(--identity "$MV_MAC_SIGN_IDENTITY" --skip-notarize) ;;
          esac
          python3 tools/mac/macpack.py cli "${args[@]}"
          cp build/release/cli/driftwire-"$VERSION"-macos-*.tar.gz upload/

      - name: Import add-on (join, sign, notarize, pack)
        if: inputs.mode == 'stable'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p addon/arm64 build/addons
          tar -xf apps/ImportAddon-arm64.tar -C addon/arm64
          if [[ -f apps/ImportAddon-x64.tar ]]; then
            mkdir -p addon/x86_64
            tar -xf apps/ImportAddon-x64.tar -C addon/x86_64
            python3 tools/mac/lipo_merge.py --arm64 addon/arm64 --x86_64 addon/x86_64 --out build/addons/import
          else
            cp -R addon/arm64 build/addons/import
          fi
          python3 tools/mac/macpack.py addon --dir build/addons/import \
            --identity "$MV_MAC_SIGN_IDENTITY" --notary-profile mediaviewer-notary
          python3 tools/package/addon-pack.py pack --platform macos --src build/addons/import \
            --version "$VERSION" --key "$RUNNER_TEMP/release.key" --out build/release/addon --require-pinned-key
          cp build/release/addon/mediaviewer-addon-import-macos.zip \
             build/release/addon/mediaviewer-addon-import-macos.json \
             build/release/addon/mediaviewer-addon-import-macos.json.sig upload/

      # Places (docs/design/27): joined and signed like Import; the code is
      # notarized first, then the place database goes into data/ and the
      # folder is packed (the data carries no code; ditto keeps the signature).
      # Preferred, not required: a failure here leaves the release without it.
      - name: Places add-on (join, sign, notarize, stage the place database, pack)
        if: inputs.mode == 'stable'
        timeout-minutes: 30
        run: |
          if ! (
            set -euo pipefail
            mkdir -p places/arm64 build/addons
            tar -xf apps/PlacesAddon-arm64.tar -C places/arm64
            if [[ -f apps/PlacesAddon-x64.tar ]]; then
              mkdir -p places/x86_64
              tar -xf apps/PlacesAddon-x64.tar -C places/x86_64
              python3 tools/mac/lipo_merge.py --arm64 places/arm64 --x86_64 places/x86_64 --out build/addons/places
            else
              cp -R places/arm64 build/addons/places
            fi
            python3 tools/mac/macpack.py addon --dir build/addons/places \
              --identity "$MV_MAC_SIGN_IDENTITY" --notary-profile mediaviewer-notary
            python3 tools/package/addon-pack.py stage-places --src build/addons/places \
              --downloads "$RUNNER_TEMP/geo-downloads" --accept-upstream
            python3 tools/package/addon-pack.py pack --addon places --platform macos --src build/addons/places \
              --version "$VERSION" --key "$RUNNER_TEMP/release.key" --out build/release/addon --require-pinned-key
            cp build/release/addon/mediaviewer-addon-places-macos.zip \
               build/release/addon/mediaviewer-addon-places-macos.json \
               build/release/addon/mediaviewer-addon-places-macos.json.sig upload/
          ); then
            echo "::warning::Places add-on was not packed; this release will not carry it."
            rm -f upload/mediaviewer-addon-places-macos.zip \
                  upload/mediaviewer-addon-places-macos.json \
                  upload/mediaviewer-addon-places-macos.json.sig
          fi

      # Driftwire (docs/design/28): joined and signed like Places, code only.
      - name: Driftwire add-on (join, sign, notarize, pack)
        if: inputs.mode == 'stable'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p driftwire/arm64 build/addons
          tar -xf apps/DriftwireAddon-arm64.tar -C driftwire/arm64
          if [[ -f apps/DriftwireAddon-x64.tar ]]; then
            mkdir -p driftwire/x86_64
            tar -xf apps/DriftwireAddon-x64.tar -C driftwire/x86_64
            python3 tools/mac/lipo_merge.py --arm64 driftwire/arm64 --x86_64 driftwire/x86_64 --out build/addons/driftwire
          else
            cp -R driftwire/arm64 build/addons/driftwire
          fi
          python3 tools/mac/macpack.py addon --dir build/addons/driftwire \
            --identity "$MV_MAC_SIGN_IDENTITY" --notary-profile mediaviewer-notary
          python3 tools/package/addon-pack.py pack --addon driftwire --platform macos --src build/addons/driftwire \
            --version "$VERSION" --key "$RUNNER_TEMP/release.key" --out build/release/addon --require-pinned-key
          cp build/release/addon/mediaviewer-addon-driftwire-macos.zip \
             build/release/addon/mediaviewer-addon-driftwire-macos.json \
             build/release/addon/mediaviewer-addon-driftwire-macos.json.sig upload/

      - name: Local search pack (sign, notarize, stage models, pack)
        if: inputs.mode == 'stable'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p build/addons/ai
          tar -xf apps/AiAddon-arm64.tar -C build/addons/ai
          # Code first: the notary service gets the binaries, not our exports.
          # The Sound, Documents, People and Large pieces carry no code.
          python3 tools/mac/macpack.py addon --dir build/addons/ai \
            --identity "$MV_MAC_SIGN_IDENTITY" --notary-profile mediaviewer-notary
          # --upstream remote (#482): upstream models are fetched on install.
          for piece in ai ai-audio ai-docs ai-faces ai-large; do
            python3 tools/package/ai-models.py stage --piece "$piece" --out "build/addons/$piece" --upstream remote
            python3 tools/package/addon-pack.py pack --addon "$piece" --platform macos --src "build/addons/$piece" \
              --version "$VERSION" --key "$RUNNER_TEMP/release.key" --out build/release/addon --require-pinned-key
            cp "build/release/addon/mediaviewer-addon-$piece-macos.zip" \
               "build/release/addon/mediaviewer-addon-$piece-macos.json" \
               "build/release/addon/mediaviewer-addon-$piece-macos.json.sig" upload/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.prepare.outputs.version }}
          path: upload/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mv-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/release.key"

  # The driftwire command line's Linux packages (docs/design/28 "From a
  # terminal"), x64 and arm64, built and tested as CI's driftwire-cli-linux
  # job builds them (.github/actions/driftwire-cli-linux): Ubuntu 22.04 and
  # GCC 12, so glibc 2.35 up. Each must carry the release's version. They
  # leave this machine through the package repository (driftwire-repo, below,
  # on a stable release once it is turned on), which is how they are updated
  # (docs/design/12, 2026-10-24); otherwise they are this run's artefacts.
  # Publish does not wait for this job, so it never holds up the installers.
  linux-cli:
    name: driftwire Linux ${{ matrix.arch }} packages
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        uses: ./.github/actions/driftwire-cli-linux
        with:
          arch: ${{ matrix.arch }}
          version: ${{ needs.prepare.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: driftwire-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish both installers together
    needs: [prepare, windows, macos]
    if: inputs.mode != 'artifacts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.prepare.outputs.version }}'
          path: release-assets
          merge-multiple: true
      - name: Validate, upload to draft, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          # The jobs above pack Import and Driftwire; publish requires both
          # (stable), and uploads only add-ons it lists (github-release.py).
          # Places is uploaded when its pack is complete and is not required.
          MV_RELEASE_ADDONS: '1'
          # ...and the Local search pack with its Sound and People pieces (and,
          # on Windows, NVIDIA acceleration).
          MV_RELEASE_AI: '1'
          # The driftwire command line is published by one repository
          # variable, MV_DRIFTWIRE_REPO (docs/design/12, 2026-10-24): on a
          # stable release it makes this job require and upload the macOS
          # archive and the Windows zip the jobs above packed, and turns on
          # driftwire-repo (the package repository and both one-line
          # installers on GitHub Pages) and driftwire-homebrew (the tap's
          # formula), below. Off, or on a preview, the archives are ignored.
          MV_RELEASE_CLI: ${{ vars.MV_DRIFTWIRE_REPO == '1' && '1' || '0' }}
          # The driftwire Linux packages (linux-cli) reach people through the
          # package repository (driftwire-repo), their update channel, and are
          # not attached here: a .deb from the release page would install
          # without the source that updates it. '1' attaches them too, with
          # every preview and stable release then requiring all six
          # (github-release.py); add linux-cli to this job's needs with it.
          MV_RELEASE_LINUX_CLI: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tools/package/github-release.py publish release-assets

  # The driftwire package repository (docs/design/28 "Installing",
  # tools/package/driftwire_repo.py): signed apt and dnf repositories, the
  # tarballs, the macOS archive, the Windows zip and the one-line installers
  # for Linux and macOS without Homebrew (install.sh) and Windows
  # (install.ps1), built from this release's linux-cli packages and the macOS
  # archive and Windows zip as the release published them, and
  # deployed to this repository's GitHub Pages under <Pages URL>/driftwire/
  # once the release is published. It is the command line's update channel
  # on Linux and Windows (docs/design/12, 2026-10-24), so it follows stable
  # releases only, and only once the owner has set it up (DEVELOPMENT
  # "Publishing the command line"): Pages with GitHub Actions as its source,
  # a v* tag rule on the github-pages environment (its own rule allows main
  # only, and a release may run from its tag), the signing key in the
  # repository secret DRIFTWIRE_REPO_GPG_KEY (armored; a passphrase, if any,
  # in DRIFTWIRE_REPO_GPG_PASSPHRASE), and the repository variable
  # MV_DRIFTWIRE_REPO=1. Each run replaces the whole Pages site. The
  # installers' publish does not wait for it.
  driftwire-repo:
    name: driftwire package repository and installers (GitHub Pages)
    needs: [prepare, linux-cli, publish]
    if: inputs.mode == 'stable' && vars.MV_DRIFTWIRE_REPO == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}driftwire/
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: driftwire-linux-*-${{ needs.prepare.outputs.version }}
          path: driftwire-packages
          merge-multiple: true

      # As published (publish required them): the site serves these very
      # files, and install.sh takes the macOS archive on a Mac without Homebrew.
      - name: The Windows zip and the macOS archive from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "driftwire-$VERSION-windows-x64.zip" --pattern "driftwire-$VERSION-macos-*.tar.gz" \
            --dir driftwire-packages

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg shellcheck
          ls -l driftwire-packages

      # Its base_url output is the site's address. It fails, saying so, when
      # Pages is not enabled with GitHub Actions as its source.
      - name: Pages
        id: pages
        uses: actions/configure-pages@v5

      # Into a GnuPG home of this job's own, outside the site; every secret key
      # in the secret signs (two during a key change, the old one first).
      - name: Signing key
        env:
          DRIFTWIRE_REPO_GPG_KEY: ${{ secrets.DRIFTWIRE_REPO_GPG_KEY }}
        run: |
          if [ -z "$DRIFTWIRE_REPO_GPG_KEY" ]; then
            echo "::error::MV_DRIFTWIRE_REPO is 1 but the secret DRIFTWIRE_REPO_GPG_KEY is not set. Add the armored private signing key (docs/DEVELOPMENT.md, Linux package repository), or set MV_DRIFTWIRE_REPO to 0."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/driftwire-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$DRIFTWIRE_REPO_GPG_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "sec" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }' \
            > "$RUNNER_TEMP/driftwire-keys"
          if [ ! -s "$RUNNER_TEMP/driftwire-keys" ]; then
            echo "::error::The secret DRIFTWIRE_REPO_GPG_KEY holds no secret key."
            exit 1
          fi
          echo "Signing with: $(tr '\n' ' ' < "$RUNNER_TEMP/driftwire-keys")"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # A release signed with Trusted Signing must carry a signed driftwire.exe;
      # install.ps1 then insists on valid signatures (driftwire_repo.py reads
      # whether the file is signed). Whether the secret is set, not what it holds.
      - name: Build the site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          DRIFTWIRE_REPO_GPG_PASSPHRASE: ${{ secrets.DRIFTWIRE_REPO_GPG_PASSPHRASE }}
          WINDOWS_SIGNED: ${{ secrets.TRUSTED_SIGNING_ENDPOINT != '' && '1' || '' }}
        run: |
          keys=()
          while read -r fpr; do keys+=(--key-id "$fpr"); done < "$RUNNER_TEMP/driftwire-keys"
          if [ -n "$WINDOWS_SIGNED" ]; then keys+=(--require-windows-signature); fi
          python3 tools/package/driftwire_repo.py build --packages driftwire-packages --out site \
            --base-url "${BASE_URL%/}/driftwire" --github-repo "$GITHUB_REPOSITORY" "${keys[@]}"
          shellcheck site/driftwire/install.sh

      # The site as it will be served, with the real key, before it goes live:
      # installed with apt from localhost, an index changed by one byte
      # refused, removed; the tarball route too.
      - name: Check the site
        run: python3 tools/package/driftwire_repo.py smoke --site site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Forget the signing key
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/driftwire-gnupg" --kill all 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/driftwire-gnupg" "$RUNNER_TEMP/driftwire-keys"

  # The Homebrew tap (docs/design/28 "Installing"): `brew install
  # <owner>/tap/driftwire` reads Formula/driftwire.rb in the public repository
  # <owner>/homebrew-tap, which this job rewrites for each stable release once
  # the command line is published (MV_DRIFTWIRE_REPO=1): the formula points at
  # the macOS archive as the release published it, with that file's SHA-256
  # (tools/package/homebrew_formula.py). The owner creates the tap repository
  # and the secret HOMEBREW_TAP_TOKEN, a fine-grained token with Contents:
  # write on that repository only (DEVELOPMENT "Publishing the command line").
  # A tap without a README about driftwire gets packaging/macos's. The
  # installers' publish does not wait for it.
  driftwire-homebrew:
    name: driftwire Homebrew tap
    needs: [prepare, macos, publish]
    if: inputs.mode == 'stable' && vars.MV_DRIFTWIRE_REPO == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: The tap's token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::MV_DRIFTWIRE_REPO is 1 but the secret HOMEBREW_TAP_TOKEN is not set. Add a fine-grained token with Contents: write on ${GITHUB_REPOSITORY_OWNER}/homebrew-tap (docs/DEVELOPMENT.md, Publishing the command line), or set MV_DRIFTWIRE_REPO to 0."
            exit 1
          fi

      # As published: the formula's checksum is that of the file people download.
      - name: The macOS archive from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cli
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "driftwire-$VERSION-macos-*.tar.gz" --dir cli
          ls -l cli
          archives=(cli/driftwire-"$VERSION"-macos-*.tar.gz)
          if [ "${#archives[@]}" != 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::$TAG should carry one macOS archive of driftwire."
            exit 1
          fi
          echo "ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the formula and push it
        run: |
          python3 tools/package/homebrew_formula.py render --version "$VERSION" --archive "$ARCHIVE" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ARCHIVE")" \
            --homepage "https://github.com/$GITHUB_REPOSITORY" --out tap/Formula/driftwire.rb
          ruby -c tap/Formula/driftwire.rb
          if ! grep -qs driftwire tap/README.md; then
            python3 tools/package/homebrew_formula.py readme --github-repo "$GITHUB_REPOSITORY" --out tap/README.md
          fi
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/driftwire.rb README.md
          if git diff --cached --quiet; then
            echo "The tap already has driftwire $VERSION."
            exit 0
          fi
          git commit -q -m "driftwire $VERSION" -m "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          git push
          echo "Pushed driftwire $VERSION to ${GITHUB_REPOSITORY_OWNER}/homebrew-tap." >> "$GITHUB_STEP_SUMMARY"
