# SPDX-License-Identifier: GPL-2.0-or-later
#
# PR 8 release pipeline (plan/13 Part 1, plan/11).
#
#   workflow_dispatch -> packages both hosts, uploads workflow artefacts
#
# CI does NOT create GitHub Releases. Releases are cut locally and uploaded by
# hand (RELEASING.md), because the signing keys live on the release machine and
# not here. This workflow exists to prove the packaging still builds.
#
# One packaging implementation: tools/package/build-release.ps1 does payload ->
# vpk pack -> signed manifest -> ISCC wizard. This file builds, tests, gates the
# licence, then calls it and keeps the result as a workflow artefact.
#
# Secrets (none needed for a dry run):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET    Trusted Signing service principal
#   TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
#   MV_MANIFEST_SIGNING_KEY   Ed25519 private key, hex (tools/package/update-signing.md)
#
# Nothing here runs on a push. Tagging a release must not start a four-hour
# two-platform build that cannot sign anything anyway; the tag is cut locally
# with the artefacts already in hand.

name: Release

on:
  workflow_dispatch:
    inputs:
      min_version:
        description: 'Manifest min_version (kill switch floor)'
        required: false
        default: '0.0.0'
      blocklist:
        description: 'Comma-separated versions to blocklist in the manifest'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_COMMIT: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4

jobs:
  release:
    name: Windows — build, package, sign
    runs-on: windows-latest
    timeout-minutes: 240
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV

      # Same key as ci.yml's MSVC legs: identical ports and triplet.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-msvc

      # Versions stay strict x.y.z, because that is all ReleaseVersion parses
      # and the signed manifest compares (UpdateManifest.cs). A suffixed version
      # would make the updater go inert rather than fail loudly, so there is none.
      # A tag must agree with CMakeLists.txt; a dispatch build is only ever an
      # artefact, so the run number keeps its name unique.
      - name: Version
        id: v
        run: |
          $cmake = Get-Content -Raw CMakeLists.txt
          if ($cmake -notmatch 'project\(\s*mediaviewer\s+VERSION\s+([0-9]+)\.([0-9]+)\.([0-9]+)') { throw 'No project VERSION in CMakeLists.txt' }
          $base = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          if ('${{ github.ref_type }}' -eq 'tag') {
            if ('${{ github.ref_name }}' -ne "v$base") {
              throw "Tag ${{ github.ref_name }} does not match CMake project VERSION $base (expected v$base)."
            }
            $version = $base
          } else {
            $version = "$($Matches[1]).$($Matches[2]).${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "MediaViewer $version"

      # Stamp it before configuring, so the exe's VERSIONINFO, MV_APP_VERSION,
      # the Velopack package and the manifest all say the same thing. The edit
      # is to the runner's working copy only; nothing is committed back.
      - name: Stamp the version into CMakeLists.txt
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $p = Join-Path (Get-Location) 'CMakeLists.txt'
          $t = [System.IO.File]::ReadAllText($p)
          $t = [regex]::Replace($t, '(project\(\s*mediaviewer\s+VERSION\s+)[0-9]+\.[0-9]+\.[0-9]+', "`${1}$v", 1)
          [System.IO.File]::WriteAllText($p, $t)
          if ([System.IO.File]::ReadAllText($p) -notmatch "VERSION\s+$([regex]::Escape($v))") { throw "Version stamp failed" }
          Write-Host "stamped $v"

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      # The framework-dependent dev build the tests load needs this; the shipped
      # payload carries its own runtimes and does not.
      - name: Install Windows App SDK runtime (tests only)
        run: ./tools/install-windows-app-runtime.ps1

      - name: Unit tests
        timeout-minutes: 20
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Licence policy (manifest + vcpkg tree)
        run: ./tools/licence-check.ps1 -VcpkgInstalledRoot build/vcpkg_installed

      - name: Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # Secrets become files here and nowhere else. Both are written under
      # RUNNER_TEMP, never the workspace, so neither can be picked up by a
      # packaging glob or committed by a later step.
      - name: Signing material
        id: sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          MV_MANIFEST_SIGNING_KEY: ${{ secrets.MV_MANIFEST_SIGNING_KEY }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $meta = ''; $key = ''
          if ($env:AZURE_TENANT_ID -and $env:TRUSTED_SIGNING_ENDPOINT) {
            $meta = Join-Path $env:RUNNER_TEMP 'trusted-signing.json'
            @{
              Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
              CertificateProfileName = $env:TRUSTED_SIGNING_PROFILE
            } | ConvertTo-Json | Set-Content -Encoding utf8 $meta
          }
          if ($env:MV_MANIFEST_SIGNING_KEY) {
            $key = Join-Path $env:RUNNER_TEMP 'release.key'
            Set-Content -Encoding ascii -NoNewline $key $env:MV_MANIFEST_SIGNING_KEY
          }
          if ($env:IS_TAG -eq 'true' -and (-not $meta -or -not $key)) {
            throw 'A tagged release requires both Trusted Signing secrets and MV_MANIFEST_SIGNING_KEY. Refusing to publish a stable release that users cannot verify.'
          }
          if (-not $meta) { Write-Host '::warning::No code-signing secrets. Binaries and wizard will be UNSIGNED.' }
          if (-not $key)  { Write-Host '::warning::No MV_MANIFEST_SIGNING_KEY. The manifest is unsigned and clients will reject it by design.' }
          "meta=$meta" >> $env:GITHUB_OUTPUT
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Package (payload, Velopack set, manifest, wizard)
        run: |
          $a = @{ BuildDir = 'build'; Version = '${{ steps.v.outputs.version }}' }
          if ('${{ steps.sign.outputs.meta }}') { $a.SigningMetadata = '${{ steps.sign.outputs.meta }}' }
          if ('${{ steps.sign.outputs.key }}')  { $a.ManifestKey     = '${{ steps.sign.outputs.key }}' }
          $min = '${{ github.event.inputs.min_version }}'; if ($min) { $a.MinVersion = $min }
          $bl  = '${{ github.event.inputs.blocklist }}';   if ($bl)  { $a.Blocklist  = $bl }
          ./tools/package/build-release.ps1 @a

      - name: Collect release assets
        id: assets
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'upload')
          $files = @(Get-ChildItem dist/releases -File | ForEach-Object FullName)
          $wizard = "dist/MediaViewer-$v-Setup.exe"
          if (-not (Test-Path $wizard)) { throw "Missing wizard $wizard" }
          $files += (Resolve-Path $wizard).Path
          foreach ($f in $files) { Copy-Item $f $out }
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
          "dir=$out" >> $env:GITHUB_OUTPUT

      - name: Upload assets (workflow artefact)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.v.outputs.version }}
          path: ${{ steps.assets.outputs.dir }}
          retention-days: 30


  # macOS is a second host of the same core (plan/15, D9), so it gets the same
  # treatment: every push to main proves the .app and the disk image still
  # build. It runs after the Windows job because that job creates the GitHub
  # Release this one uploads into.
  #
  # Notarization needs an Apple Developer ID and a notarytool profile. Without
  # them macpack.py can still assemble and ad-hoc sign, which is what proves the
  # packaging works; the artefact is then NOT distributable and says so. A
  # tagged release refuses to produce one, the same way the Windows job does.
  macos:
    name: macOS — app bundle and disk image
    needs: release
    runs-on: macos-14
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-arm64-osx

      # The same version the Windows job resolved, so one push produces one
      # version across both hosts rather than two that merely look alike.
      - name: Stamp the version into CMakeLists.txt
        run: |
          v='${{ needs.release.outputs.version }}'
          python3 - "$v" <<'PY'
          import re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("CMakeLists.txt")
          t = p.read_text()
          t, n = re.subn(r'(project\(\s*mediaviewer\s+VERSION\s+)[0-9]+\.[0-9]+\.[0-9]+', r'\g<1>' + v, t, count=1)
          if n != 1:
              raise SystemExit("version stamp failed")
          p.write_text(t)
          print("stamped", v)
          PY

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build MediaViewer.app
        run: cmake --build build --config Release --target mediaviewer_app

      - name: Unit tests
        timeout-minutes: 20
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bundle policy
        run: |
          python3 tools/mac/check_plists.py
          python3 tools/mac/test_macpack.py -v

      - name: dmgbuild
        run: python3 -m pip install --break-system-packages -r tools/mac/requirements.txt

      - name: Disk image
        env:
          MV_SIGN_IDENTITY: ${{ secrets.MV_SIGN_IDENTITY }}
          MV_NOTARY_PROFILE: ${{ secrets.MV_NOTARY_PROFILE }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          args=(--app build/MediaViewer.app --out-dir build/release)
          if [ -n "${MV_SIGN_IDENTITY:-}" ] && [ -n "${MV_NOTARY_PROFILE:-}" ]; then
            args+=(--identity "$MV_SIGN_IDENTITY" --notary-profile "$MV_NOTARY_PROFILE")
          elif [ "$IS_TAG" = "true" ]; then
            echo "A tagged release needs MV_SIGN_IDENTITY and MV_NOTARY_PROFILE. Refusing to publish a disk image Gatekeeper will block." >&2
            exit 1
          else
            echo "::warning::No Apple signing secrets. Ad-hoc signed, not notarized, NOT distributable."
            args+=(--identity - --skip-notarize --allow-no-updater)
          fi
          python3 tools/mac/macpack.py release "${args[@]}"
          ls -la build/release

      - name: Upload disk image (workflow artefact)
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.release.outputs.version }}
          path: build/release/
          retention-days: 30

