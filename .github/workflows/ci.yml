# SPDX-License-Identifier: GPL-2.0-or-later
# Correctness runs hosted. The performance gate requires an explicitly
# provisioned interactive GPU runner; missing configuration fails promptly.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  # Pinned to vcpkg.json's builtin-baseline. Manifest mode resolves that commit
  # against the registry's git history, so the checkout must be able to reach
  # it — cloning it ourselves is deterministic, where the runner image's
  # preinstalled vcpkg is whatever age the image happens to be.
  VCPKG_COMMIT: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4

jobs:
  # ---------------------------------------------------------------------------
  # Gates that need no compiler and must never be skipped.
  # ---------------------------------------------------------------------------
  policy:
    name: Module graph + licence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Module dependency direction
        run: ./tools/check-module-graph.ps1

      - name: Hostable core (D9)
        run: ./tools/check-hostable-core.ps1

      - name: Licence policy
        run: ./tools/licence-check.ps1

  # ---------------------------------------------------------------------------
  # Build + unit tests. MSVC is primary; clang-cl is the second opinion, because
  # it catches different bugs (plan/09).
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.toolchain }}, ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: msvc
            config: Release
            cmake_args: ''
          - toolchain: msvc
            config: Debug
            cmake_args: ''
          - toolchain: clang-cl
            config: Release
            cmake_args: '-T ClangCL'
          - toolchain: msvc-asan
            config: Debug
            cmake_args: '-DMV_ASAN=ON'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Versioned aka.ms URL, not /stable/: that alias redirects to Bing HTML.
      - name: Install Windows App SDK runtime
        run: ./tools/install-windows-app-runtime.ps1

      # Facts before theories. When a Windows CI build fails to configure, the
      # question is always "which Visual Studio, which CMake, which vcpkg" —
      # answering it in the log costs seconds and saves a round trip per guess.
      - name: Diagnose toolchain
        run: |
          cmake --version
          Write-Host "--- Visual Studio instances ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -prerelease -products * -format value `
              -property displayName,installationVersion,installationPath
          } else {
            Write-Host "vswhere.exe not present"
          }
          Write-Host "--- vcpkg ---"
          Write-Host "VCPKG_INSTALLATION_ROOT = $env:VCPKG_INSTALLATION_ROOT"

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          # Full history, not shallow. Manifest mode resolves the baseline
          # through git, and vcpkg has been known to refuse to operate in a
          # shallow clone. A minute of clone beats an error that reads as a
          # missing port.
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV

      # PR 1 pulls only imgui and catch2, so this is a small cache. It exists to
      # keep the matrix from rebuilding the same two ports four times.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ matrix.toolchain }}

      # No -G: CMake picks the newest Visual Studio generator the image has, so
      # this does not break the day the runner image moves to a new VS. No
      # -DCMAKE_TOOLCHAIN_FILE either — CMakeLists.txt finds it from VCPKG_ROOT.
      - name: Configure
        run: cmake -S . -B build -A x64 ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Unit tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # ---------------------------------------------------------------------------
  # The C# side of the ABI: SafeHandle, struct layout, completion drain.
  # ---------------------------------------------------------------------------
  abi-smoke:
    name: ABI smoke test (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV

      - name: Build the core
        run: |
          cmake -S . -B build -A x64 -DMV_BUILD_TESTS=OFF
          cmake --build build --config Release --target mediaviewer_core

      - name: Run the smoke test
        run: |
          dotnet build src.managed/MediaViewer.AbiSmokeTest/MediaViewer.AbiSmokeTest.csproj -c Release
          dotnet src.managed/MediaViewer.AbiSmokeTest/bin/Release/net8.0-windows/MediaViewer.AbiSmokeTest.dll build/bin/Release

  # ---------------------------------------------------------------------------
  # The D6 gate. Real GPU only.
  # ---------------------------------------------------------------------------
  frametime:
    name: Frame-time gate (self-hosted GPU)
    # Skip when no GPU runner is opted in. Hosted Windows cannot measure D6, and
    # failing the whole workflow for that used to red-X every PR on a machine
    # that does not exist. A skip is not a pass. Fork code must not execute on
    # the persistent runner. If the variable is set but the runner is missing,
    # GitHub still queues — set MV_GPU_RUNNER_ENABLED only after provisioning.
    if: ${{ vars.MV_GPU_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 15
    concurrency:
      group: frametime-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows App SDK runtime
        run: ./tools/install-windows-app-runtime.ps1

      - name: Configure and build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release

      - name: Swapchain recovery and handle ownership
        run: ./build/bin/Release/mv_swapchain_recovery.exe

      - name: Restore the rolling baseline
        uses: actions/cache/restore@v4
        with:
          path: build/bin/Release/frametime-baseline.json
          key: frametime-v2-${{ runner.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: frametime-v2-${{ runner.name }}-

      - name: Animated (cached blit) and idle 60-second gates
        env:
          UPDATE_BASELINE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          $soakArgs = @('--seconds', '60')
          if ($env:UPDATE_BASELINE -eq 'true') { $soakArgs += '--update-baseline' }
          ./build/bin/Release/frametime.exe @soakArgs

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frametime-report
          path: |
            build/bin/Release/frametime-report.json
            build/bin/Release/frametime-idle-report.json

      - uses: actions/cache/save@v4
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: build/bin/Release/frametime-baseline.json
          key: frametime-v2-${{ runner.name }}-${{ github.run_id }}-${{ github.run_attempt }}
